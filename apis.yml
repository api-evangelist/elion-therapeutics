aid: elion-therapeutics
name: Elion Therapeutics
description: 'Elion Therapeutics is a privately held, clinical-stage biotechnology company
  developing treatments for life-threatening invasive fungal infections (IFIs). Formerly
  known as Sfunga Therapeutics, the company was founded on the belief that mechanistic
  insight into natural products enables targeted optimization of them. Its lead candidate,
  SF001, is a next-generation polyene antifungal — a rationally designed analog of amphotericin
  B intended to retain broad fungicidal activity while mitigating the systemic toxicity
  that limits the parent molecule. SF001 received FDA Qualified Infectious Disease Product
  (QIDP) and Fast Track designations in 2023 and has advanced from a first-in-human
  single-ascending-dose study into multiple-ascending-dose evaluation. Elion closed an
  $81 million Series B in June 2024 led by Deerfield Management and the AMR Action Fund,
  with participation from Illinois Ventures. Elion is a therapeutics developer, not a
  software vendor: it publishes no developer program, public API, or machine-readable
  API contract, and this profile records that absence rather than any API surface.'
